<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Opinião de valor do seu imóvel — Nova São Paulo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{ --navy:#1E2D4A; --azul:#0088CC; --emerald:#047857; --bg:#f6f7f9; --line:#e6e8ec; --muted:#6b7280; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:#111827;font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px;border-bottom:3px solid var(--azul);margin-bottom:16px}
  header img{height:52px}
  .brand b{display:block;font-size:1.02em}
  .brand span{color:var(--muted);font-size:.85em}
  .firma{text-align:right;font-size:.8em;color:var(--muted);line-height:1.4}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.04);page-break-inside:avoid}
  .kicker{color:var(--muted);font-size:.78em;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .big{font-size:2.1em;font-weight:800;margin:6px 0 2px}
  .sub{color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;font-size:.92em}
  .grid .kicker,.grid3 .kicker{font-weight:500}
  .grid b{font-size:1.05em}
  .incorp{border-left:4px solid var(--emerald)}
  .incorp .big{color:var(--emerald)}
  .badge{display:inline-block;background:#d1fae5;color:var(--emerald);padding:2px 10px;border-radius:999px;font-size:.8em;font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:.86em;margin-top:8px}
  th{color:var(--muted);text-align:left;font-weight:500;padding:6px 8px}
  td{padding:6px 8px;border-top:1px solid #f1f3f5;vertical-align:top}
  .r{text-align:right;white-space:nowrap}
  .foot{color:var(--muted);font-size:.82em;margin-top:8px}
  .cta{background:var(--navy);color:#fff;border-radius:14px;padding:20px;text-align:center}
  .cta a{display:inline-block;margin-top:10px;background:#fff;color:var(--navy);text-decoration:none;font-weight:700;padding:10px 18px;border-radius:10px}
  .center{text-align:center;color:var(--muted);padding:60px 20px}
  .imovel{font-size:1.15em;font-weight:700}
  .linha{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid #f1f3f5;font-size:.92em}
  .linha b{white-space:nowrap}
  .neg{color:#b91c1c}
  .tot{border-top:2px solid var(--emerald);font-weight:700}
  .metodo p{margin:6px 0;font-size:.92em}
  .sec{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
  .sec .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:.78em;font-weight:700;display:grid;place-items:center;transform:translateY(-2px)}
  .sec h2{margin:0;font-size:1.08em;color:var(--navy)}
  .passo{margin:10px 0 0;padding-left:12px;border-left:3px solid var(--line)}
  .passo b.t{display:block;color:var(--navy)}
  .res{margin-top:12px;padding:10px 12px;background:#f0f6fb;border-radius:10px}
  .titulo-doc{font-size:1.45em;font-weight:800;color:var(--navy);margin:2px 0 0}
  #mapa{height:300px;border-radius:10px;border:1px solid var(--line)}
  .assin{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px;font-size:.9em}
  .assin .kicker{margin-bottom:4px}
  .barra{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
  .barra button{background:var(--navy);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer}
  @media print{
    body{background:#fff;font-size:12px}
    .wrap{max-width:none;padding:0}
    .card{box-shadow:none;border:1px solid #ddd;border-radius:6px;padding:10px 12px;margin-bottom:8px}
    .big{font-size:1.7em}
    .cta,.barra,.no-print{display:none!important}
    #mapa{height:260px}
    a{color:inherit;text-decoration:none}
    @page{margin:14mm 12mm}
  }
.av-tt{background:#dc2626;color:#fff;border:0;font-weight:600;font-size:.8em;padding:2px 8px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.3)} .av-tt:before{border-top-color:#dc2626}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="display:flex;align-items:center;gap:12px">
      <img src="icons/logo-nsp.png" alt="Imobiliária Nova São Paulo" onerror="this.style.display='none'">
      <div class="brand"><b>Imobiliária Nova São Paulo</b><span>Opinião de valor de imóvel · dossiê</span></div>
    </div>
    <div class="firma" id="firma"></div>
  </header>
  <div class="barra no-print" id="barra" style="display:none"><button onclick="window.print()">📄 Salvar em PDF / imprimir</button></div>
  <div id="conteudo"><div class="center">Carregando avaliação…</div></div>
</div>

<script>
const SBU = 'https://mqcduyvpuxdweqesgwrq.supabase.co';
const SBK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xY2R1eXZwdXhkd2VxZXNnd3JxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MzE5OTcsImV4cCI6MjA5MzQwNzk5N30.QdpRZRxnYF6GTh13wdTNqZTQ-9ztY3veef62mfGRphE';
// Dados da imobiliária que vão no cabeçalho e na assinatura do dossiê
const TEXTO_LEGAL = 'Este documento é uma opinião de valor para fins de comercialização, elaborada pela Imobiliária Nova São Paulo a partir de dados públicos (ITBI, zoneamento, outorga) e de mercado (anúncios e negócios fechados), por meio automatizado revisado pelo corretor responsável. Não constitui laudo de avaliação nem parecer técnico de avaliação mercadológica (NBR 14.653 / Resolução COFECI 1.066/2007), não substitui vistoria e não vale como garantia de preço de venda. Os valores podem variar com as condições do imóvel, da documentação e do mercado. O zoneamento, os coeficientes de aproveitamento e os gabaritos indicados vêm da base pública do GeoSampa e são aproximados: o enquadramento do lote deve ser confirmado pelo proprietário junto à Prefeitura de São Paulo (ficha técnica / certidão de zoneamento) antes de qualquer decisão, e a altura máxima construível depende ainda das restrições do COMAER (zona de proteção do Aeroporto de Congonhas) e de verificação em projeto.';
const NSP = { nome:'Imobiliária Nova São Paulo', creci:'CRECI 02061-J', desde:'desde 1969',
              endereco:'Av. Jabaquara, 1947 — Saúde, São Paulo/SP', site:'www.novasaopaulo.com.br', telefone:'' };
const R$ = v => (v==null||v===''||isNaN(Number(v))) ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{maximumFractionDigits:0});
const N  = v => (v==null||isNaN(Number(v))) ? '—' : Number(v).toLocaleString('pt-BR',{maximumFractionDigits:0});
const params = new URLSearchParams(location.search);
const q = params.get('t'); const modoPdf = params.get('pdf')==='1';

document.getElementById('firma').innerHTML = `${NSP.creci} · ${NSP.desde}<br>${NSP.endereco}<br>${NSP.site}${NSP.telefone?' · '+NSP.telefone:''}`;

async function carregar(){
  const box = document.getElementById('conteudo');
  if(!q){ box.innerHTML = '<div class="center">Link inválido.</div>'; return; }
  try{
    const r = await fetch(`${SBU}/rest/v1/rpc/aval_por_token?p_token=${encodeURIComponent(q)}`,
      { headers:{ apikey:SBK, Authorization:'Bearer '+SBK } });
    const arr = await r.json();
    const x = Array.isArray(arr) ? arr[0] : arr;
    if(!x){ box.innerHTML = '<div class="center">Esta avaliação não está disponível.<br>Fale com o seu corretor da Nova São Paulo.</div>'; return; }
    box.innerHTML = render(x);
    document.getElementById('barra').style.display = '';
    await desenharMapa(x);
    if(modoPdf) setTimeout(()=>window.print(), 1800);
  }catch(e){ box.innerHTML = '<div class="center">Não foi possível carregar a avaliação.</div>'; }
}

function render(x){
  let comps=[]; try{ comps = typeof x.comparaveis==='string'?JSON.parse(x.comparaveis):(x.comparaveis||[]); }catch(_){}
  const mem = x.memoria || {}; const mu = mem.metodo_unico || null; const inc = mem.incorp || null; const P = mem.param || {}; const ev = mem.evolutivo || null;
  const dt = x.gerado_em ? new Date(x.gerado_em).toLocaleDateString('pt-BR') : '';
  const dtAp = x.aprovado_em ? new Date(x.aprovado_em).toLocaleDateString('pt-BR') : dt;
  const ent = x.entorno || null;
  // qual método valeu para este imóvel
  const ehCom = /comercial|galp|loja|sala/i.test(x.tipo||'');
  const metodoAdotado = (mu && mu.usar_predio && mu.mesmo_predio) ? 'predio' : ev && ev.so_terreno ? 'terreno' : (ev && ev.calibrado ? 'casa' : (ehCom && ev ? 'com' : (ev ? 'casa_media' : 'apto')));
  const frase = { predio:'Calculado pelas vendas registradas no próprio prédio, de unidades com a mesma planta.',
    apto:'Calculado pelo preço por m² de área útil: anúncios à venda e vendas reais registradas perto do imóvel.',
    casa:'Calculado como terreno + construção: o terreno pelo preço das vendas de casas por perto; a construção pelo padrão, idade e estado.',
    casa_media:'Média entre a comparação com casas por perto e a soma de terreno + construção.',
    com:'Calculado como terreno a preço de lote + construção depreciada.',
    terreno:'Calculado como lote para construir, pelo preço por m² de terreno.' }[metodoAdotado];
  const areaLb = (metodoAdotado==='apto'||metodoAdotado==='predio') ? 'área útil' : (metodoAdotado==='terreno' ? 'terreno' : 'área construída');
  // numeração das seções (só as que existem)
  let nSec = 0; const sec = t => `<div class="sec"><span class="n">${++nSec}</span><h2>${t}</h2></div>`;

  const cabecalho = `
    <div class="card">
      <div class="kicker">Opinião de valor${x.codigo?` · ${x.codigo}`:''}</div>
      <div class="titulo-doc">${x.endereco||'Imóvel'}${x.edificio?' — '+x.edificio:''}</div>
      <div class="sub">${x.tipo||'Imóvel'}${x.bairro?' · '+x.bairro:''} · avaliado em ${dtAp}</div>
    </div>`;

  const resumo = x.valor_mercado ? `
    <div class="card">
      ${sec('Resumo')}
      <div class="kicker">Valor de mercado estimado</div>
      <div class="big">${R$(x.valor_mercado)}</div>
      <div class="sub">Faixa para negociação: ${R$(x.faixa_min)} a ${R$(x.faixa_max)}${x.mercado_rs_m2?` · ${R$(x.mercado_rs_m2)}/m² de ${areaLb}`:''}</div>
      <p style="margin:10px 0 0;font-size:.95em">${frase}</p>
      ${x.preco_pedido?`<div class="foot">Valor pretendido ${R$(x.preco_pedido)}: ${compara(x.preco_pedido,x.valor_mercado)}.</div>`:''}
      ${x.incorp_aplicavel&&x.incorp_valor_terreno?`<div class="foot"><b>Para incorporadora:</b> o terreno pode valer até ${R$(x.incorp_valor_terreno)} (ver a seção de incorporação).</div>`:''}
    </div>` : '';

  const tx = mem.texto || null; const escT = v => String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const parecer = tx ? `
    <div class="card">
      ${sec('Análise')}
      <h3 style="margin:4px 0 8px;font-size:1.12em">${escT(tx.titulo)}</h3>
      <p style="font-weight:600">${escT(tx.resposta)}</p>
      ${(tx.secoes||[]).map(s=>`<h3 style="margin:14px 0 4px;font-size:1.02em">${escT(s.titulo)}</h3>${String(s.texto||'').split(/\n\s*\n/).map(p=>`<p style="margin:0 0 8px">${escT(p)}</p>`).join('')}`).join('')}
      ${(tx.atencao||[]).length?`<h3 style="margin:14px 0 4px;font-size:1.02em">Pontos a confirmar</h3><ul style="margin:0;padding-left:18px">${tx.atencao.map(a=>`<li>${escT(a)}</li>`).join('')}</ul>`:''}
      ${(tx.fontes||[]).length?`<div class="foot">Fontes consultadas: ${tx.fontes.map(f=>`<a href="${escT(f.url)}" target="_blank" rel="noopener">${escT(f.titulo||f.url)}</a>`).join(' · ')}</div>`:''}
    </div>` : '';

  const ip = ent && ent.iptu || null; const ipU = ip && ip.unidade || null;
  const it = (lb,v)=> v==null||v===''?'':`<div><div class="kicker">${lb}</div><b>${v}</b></div>`;
  const imovel = `
    <div class="card">
      ${sec('O imóvel')}
      <div class="grid3">
        ${it('Tipo', x.tipo)}
        ${it((metodoAdotado==='apto'||metodoAdotado==='predio')?'Área útil':'Área construída', x.area_util?Math.round(x.area_util)+' m²':null)}
        ${it('Terreno', x.terreno?Math.round(x.terreno)+' m²':null)}
        ${it('Dormitórios', x.dorm?`${x.dorm}${x.suite?` (${x.suite} suíte)`:''}`:null)}
        ${it('Vagas', x.vaga||null)}
        ${it('Frente', x.frente?x.frente+' m':null)}
        ${it('Zoneamento', x.zona?`${x.zona}${x.ca?' · CA '+Number(x.ca):''}`:null)}
        ${it('Valor pretendido', x.preco_pedido?R$(x.preco_pedido):null)}
      </div>
      ${ip && !ip.oculto ? `
      <div class="kicker" style="margin-top:16px">Cadastro da Prefeitura (IPTU 2026)</div>
      <div class="grid3" style="margin-top:6px">
        ${it('Contribuinte (SQL)', ipU?ipU.sql:ip.sql)}${it('Unidade', ipU&&ipU.complemento)}${it('Uso', ipU?ipU.uso:ip.uso)}
        ${it('Padrão', ip.padrao)}${it('Ano de construção', ip.ano_construcao)}${it('Pavimentos', ip.pavimentos)}
        ${it('Terreno do lote', ip.area_terreno?N(ip.area_terreno)+' m²':null)}${it('Testada', ip.testada?N(ip.testada)+' m':null)}
        ${it('Área construída no cadastro', (ipU?ipU.area_construida:ip.area_construida)?N(ipU?ipU.area_construida:ip.area_construida)+' m²':null)}
        ${ip.unidades_no_lote>1?it('Unidades no lote', ip.unidades_no_lote):''}
      </div>
      ${ip.desatualizado?`<div class="foot" style="color:#b45309">O cadastro de 2026 ainda descreve o lote de outra forma. É comum em prédio recente, antes de a Prefeitura desmembrar as unidades: confirme área e ano na matrícula e no carnê de IPTU da unidade.</div>`:''}
      <div class="foot">A área construída do cadastro inclui áreas comuns e garagem; não é a área útil. É informação de referência.</div>` : ''}
    </div>`;

  const temMapa = comps.some(c=>c.lat) || x.lat;
  const entorno = (ent || temMapa) ? `
    <div class="card">
      ${sec('Localização e entorno')}
      ${ent&&(ent.distrito||ent.eixo)?`<div style="font-size:.95em">${ent.distrito?`<b>Distrito ${ent.distrito}</b>`:''}${ent.eixo?` · dentro de eixo de transformação urbana (${ent.eixo}${ent.eixo_decreto?', decreto '+ent.eixo_decreto:''})`:''}</div>`:''}
      ${ent&&(ent.metro||[]).length?`<div style="font-size:.95em;margin-top:4px">🚇 <b>Metrô e trem:</b> ${ent.metro.map(m=>`${cap(m.nome)}${m.linha?' (linha '+cap(m.linha)+')':''} <span class="sub">a ${N(m.dist_m)} m</span>`).join(' · ')}</div>`:''}
      ${ent?(()=>{ const pois=ent.pois||{}, n500=ent.n500||{}, n1000=ent.n1000||{};
        const CAT=[['onibus','🚌','Ônibus'],['parque','🌳','Parques e praças'],['escola','🏫','Escolas'],['hospital','🏥','Hospitais'],['feira','🥬','Feiras livres'],['clube','🏊','Clubes e centros esportivos'],['ciclovia','🚲','Ciclovias']];
        return CAT.filter(([k])=>(pois[k]||[]).length).map(([k,ic,lb])=>`<div style="font-size:.93em;margin-top:3px">${ic} <b>${lb}:</b> ${(pois[k]||[]).slice(0,k==='onibus'?1:3).map(p=>`${cap(p.nome)} <span class="sub">a ${N(p.dist_m)} m</span>`).join(' · ')}${n1000[k]?` <span class="sub">(${n500[k]||0} a 500 m, ${n1000[k]} a 1 km)</span>`:''}</div>`).join(''); })():''}
      ${temMapa?`<div id="mapa" style="margin-top:12px"></div>
      <div class="foot"><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#dc2626;border:2px solid #fff;box-shadow:0 0 0 2px #dc2626;vertical-align:middle"></span> imóvel avaliado &nbsp; <span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:#34d399;border:2px solid #047857;vertical-align:middle"></span> vendas reais usadas na conta</div>`:''}
      <div class="foot">Distâncias em linha reta. O entorno é informação para leitura; não altera a conta. Fontes: GeoSampa (Prefeitura de São Paulo) e OpenStreetMap.</div>
    </div>` : '';

  const usados = comps.filter(c=>!c.excluido), excluidos = comps.filter(c=>c.excluido);
  const nVendas = usados.filter(c=>/ITBI|Fechamento|Venda real/i.test(c.origem||c.tipo||'')).length, nAn = usados.length - nVendas;
  const referencias = comps.length ? `
    <div class="card">
      ${sec('Referências de mercado')}
      <p style="margin:0 0 4px;font-size:.92em">${nVendas?`${nVendas} venda(s) real(is) registrada(s) na Prefeitura perto do imóvel`:''}${nVendas&&nAn?' e ':''}${nAn?`${nAn} anúncio(s) de venda`:''}${metodoAdotado==='casa'||metodoAdotado==='com'?' — usados como conferência do valor.':' — base do preço por m².'}</p>
      <table><thead><tr><th>Origem</th><th>Endereço</th><th class="r">Área</th><th class="r">Preço</th><th class="r">R$/m²</th></tr></thead>
      <tbody>${usados.map(c=>{ const itbi=/ITBI|Fechamento|Venda real/i.test(c.origem||c.tipo||''); const end=itbi?(c.endereco||'—'):String(c.endereco||'').replace(/^Anúncio (incluído pelo corretor|no próprio prédio \(achado pelo parecer\))(, por [^,]*)?/,'Anúncio no mesmo prédio ou entorno'); return `<tr>
        <td>${itbi?'<b style="color:#047857">Venda real</b>':'Anúncio'}${c.nsp?'<br><span class="sub">carteira Nova SP</span>':''}${c.data?'<br><span class="sub">'+String(c.data).slice(0,7)+'</span>':''}</td>
        <td>${c.nsp&&c.url&&/^https:\/\/www\.novasaopaulo\.com\.br\//.test(c.url)?`<a href="${c.url}" target="_blank" rel="noopener">${end||'ver anúncio'}</a>`:(end||'—')}${c.dorm?` <span class="sub">${c.dorm} dorm${c.vaga?' · '+c.vaga+' vg':''}</span>`:''}</td>
        <td class="r">${itbi&&c.area_util_est?`≈ ${c.area_util_est} m² útil${c.area?`<br><span class="sub">${Math.round(c.area)} m² no cadastro</span>`:''}`:(c.area?Math.round(c.area)+' m²':'—')}</td>
        <td class="r">${R$(c.preco)}</td>
        <td class="r">${itbi&&c.rs_util?`${R$(c.rs_util)} útil${c.rs_m2?`<br><span class="sub">${R$(c.rs_m2)} no cadastro</span>`:''}`:R$(c.rs_m2)}</td></tr>`; }).join('')}</tbody></table>
      ${excluidos.length?`<div class="foot">Deixadas de fora por destoarem do imóvel: ${excluidos.map(c=>c.endereco||c.tipo).join('; ')}.</div>`:''}
      <div class="foot"><b>Venda real</b> = transação registrada na Prefeitura de São Paulo (guia de ITBI), com o preço declarado na venda; área útil estimada a partir da área do cadastro. <b>Anúncio</b> = preço pedido, da carteira da Nova São Paulo ou de portal imobiliário; costuma fechar um pouco abaixo.</div>
    </div>` : '';

  // ── como chegamos ao valor: um texto por método ──
  const pf = v => Number(v||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
  const dec = v => (Number(v||0)*100).toLocaleString('pt-BR',{maximumFractionDigits:1});
  const bairroIdx = mu&&mu.idx_origem ? (/^média/i.test(mu.idx_origem)?'na média da Nova São Paulo':'em '+cap(String(mu.idx_origem).replace(/\s*\(NIDO\)/i,''))) : '';
  const blocoComparacao = (titulo) => mu ? `
      ${mu.rs_anuncio?`<div class="passo"><b class="t">${titulo?titulo+' · ':''}Anúncios</b>Mediana de ${mu.n_anuncio||'—'} anúncios de venda de imóveis semelhantes perto do imóvel${mu.n_nsp?` (${mu.n_nsp===mu.n_anuncio?'todos':mu.n_nsp} da carteira da Nova São Paulo)`:''}, coletados no dia da avaliação: ${R$(mu.rs_anuncio)}/m² pedido. Como o preço pedido costuma fechar abaixo, aplicamos o desconto típico medido nos negócios da Nova São Paulo (${bairroIdx}): × ${pf(mu.idx_pedido_fechado)} = <b>${R$(mu.rs_anuncio_ajust)}/m²</b>.</div>`:''}
      ${mu.rs_itbi_ajust?`<div class="passo"><b class="t">${titulo?titulo+' · ':''}Vendas reais</b>Mediana de ${mu.n_itbi||'—'} vendas registradas na Prefeitura perto do imóvel (guias de ITBI), por m² de área útil estimada: ${R$(mu.rs_itbi_util)}/m². A guia costuma declarar cerca de ${dec(mu.sub_itbi)}% abaixo do valor negociado: × ${pf(1+(mu.sub_itbi||0))} = <b>${R$(mu.rs_itbi_ajust)}/m²</b>.</div>`:''}` : '';
  let calculo = '';
  if(metodoAdotado==='predio'){
    const mp=mu.mesmo_predio, dtm=d=>{ const t=String(d||''); return t.length>=7?`${t.slice(5,7)}/${t.slice(0,4)}`:t; };
    calculo = `<p>Este prédio tem vendas recentes registradas na Prefeitura de unidades com a mesma planta do imóvel avaliado. É a referência mais direta que existe: o preço efetivamente pago, no mesmo edifício.</p>
      <div class="passo"><b class="t">Vendas no próprio prédio</b>${mp.n} vendas em ${mp.endereco}, de ${R$(mp.min)} a ${R$(mp.max)}; mediana ${R$(mp.mediana)}. A mais recente foi ${R$(mp.ultima.valor)} em ${dtm(mp.ultima.data)}.</div>
      <div class="passo"><b class="t">Ajuste</b>A guia de ITBI costuma declarar cerca de ${dec(mu.sub_itbi)}% abaixo do valor negociado: ${R$(mp.mediana)} × ${pf(1+(mu.sub_itbi||0))} = <b>${R$(mp.valor_ajust)}</b>.</div>
      <div class="res">Valor: <b>${R$(x.valor_mercado)}</b>. Faixa de ±5% para negociação.${mu.valor_final?` Como conferência, o preço por m² do bairro (anúncios e vendas por perto) indicaria ${R$(mu.valor_final)}.`:''}</div>`;
  } else if(metodoAdotado==='apto' && mu && mu.rs_final){
    calculo = `<p>O valor parte do preço por metro quadrado de área útil, medido em duas fontes independentes e ajustado para este imóvel.</p>
      ${blocoComparacao('')}
      <div class="res">Média ${mu.rs_anuncio&&mu.rs_itbi_ajust?'das duas fontes':'da fonte disponível'}: <b>${R$(mu.rs_final)}/m²</b> × ${Math.round(x.area_util||0)} m² de área útil = <b>${R$(x.valor_mercado)}</b>.${mu.divergencia!=null?` As duas fontes diferem ${Math.abs(mu.divergencia)}%.`:''} Faixa de ±7% para negociação.</div>`;
  } else if(metodoAdotado==='casa'){
    calculo = `<p>Em casa, o terreno costuma responder pela maior parte do preço. Por isso o valor é a soma do terreno com a construção, cada um medido separadamente.</p>
      <div class="passo"><b class="t">Terreno</b>${N(ev.terreno)} m² × <b>${R$(ev.rs_terreno)}/m²</b> = <b>${R$(ev.v_terreno)}</b>. O preço do terreno vem das vendas de casas registradas por perto, descontado o valor da construção de cada uma, e é ajustado ao tamanho deste lote (${ev.rs_terreno_origem||''}).</div>
      <div class="passo"><b class="t">Construção</b>${N(ev.constr)} m² × ${R$(ev.custo_m2)}/m² de construção nova (padrão ${ev.padraoLb||'médio'}) × ${Math.round((ev.fator_idade||1)*(ev.fator_estado||1)*100)}% pela idade e pelo estado (${ev.idade?ev.idade+' anos':'idade não informada'}, ${ev.estadoLb||'bom'}) = <b>${R$(ev.v_benf)}</b>. Uma casa antiga conservada mantém ao menos metade do valor de construção.</div>
      <div class="res">Terreno + construção = <b>${R$(x.valor_mercado)}</b>; o terreno responde por ${ev.pct_terreno}% do valor. Faixa de ±10% para negociação.${ev.comparativo?` Como conferência, a comparação direta com vendas e anúncios de casas por perto indica ${R$(ev.comparativo)} (${ev.divergencia>0?'+':''}${ev.divergencia}%).`:''}</div>
      ${ev.v_lote?`<p class="foot"><b>Vendido como lote para construir:</b> ${N(ev.terreno)} m² × ${R$(ev.rs_lote)}/m² = ${R$(ev.v_lote)}.${ev.v_lote>ev.total?' Supera o valor como casa: vale ofertar o imóvel a construtoras.':''}</p>`:''}
      <p class="foot">Parâmetros medidos em ${ev.fonte||'vendas de casas registradas no ITBI'}.</p>`;
  } else if(metodoAdotado==='casa_media' && ev){
    calculo = `<p>O valor é a média de duas contas.</p>
      ${blocoComparacao('Comparação')}
      <div class="passo"><b class="t">Terreno + construção</b>${N(ev.terreno)} m² × ${R$(ev.rs_terreno)}/m² de terreno = ${R$(ev.v_terreno)}, mais a construção de ${N(ev.constr)} m² depreciada ${Math.round((ev.dep||0)*100)}% = ${R$(ev.v_benf)}. Total ${R$(ev.total)}.</div>
      <div class="res">Média: <b>${R$(x.valor_mercado)}</b>. Faixa de ±7% para negociação.</div>`;
  } else if(metodoAdotado==='com' && ev){
    calculo = `<p>Para imóvel comercial, as vendas e anúncios por perto são residenciais. Por isso o valor é o do terreno, a preço de lote para construir, mais a construção depreciada.</p>
      <div class="passo"><b class="t">Terreno</b>${N(ev.terreno)} m² × ${R$(ev.rs_terreno)}/m² = <b>${R$(ev.v_terreno)}</b> (${ev.rs_terreno_origem||''}).</div>
      <div class="passo"><b class="t">Construção</b>${N(ev.constr)} m² ao custo de construção nova de ${R$(ev.custo_m2)}/m², depreciada ${Math.round((ev.dep||0)*100)}% = <b>${R$(ev.v_benf)}</b>.</div>
      <div class="res">Valor: <b>${R$(x.valor_mercado)}</b>. Faixa de ±10%.${ev.comparativo?` A referência residencial do entorno indicaria ${R$(ev.comparativo)}.`:''}</div>`;
  } else if(metodoAdotado==='terreno' && ev){
    calculo = `<div class="res">${N(ev.terreno)} m² × <b>${R$(ev.rs_terreno)}/m²</b> de terreno = <b>${R$(ev.total)}</b> (${ev.rs_terreno_origem||''}). Faixa de ±10%.</div>`;
  } else {
    calculo = `<p>${String(x.metodo||'').replace(/\s*\[incorp:.*?\]/g,'')}</p>`;
  }
  const metodo = x.valor_mercado ? `
    <div class="card metodo">
      ${sec('Como chegamos ao valor')}
      ${calculo}
      <p class="foot">Fontes: guias de ITBI da Prefeitura de São Paulo (Secretaria da Fazenda); anúncios de portais imobiliários; cadastro IPTU 2026 e zoneamento (GeoSampa, Prefeitura de São Paulo); histórico de negócios da Nova São Paulo; custo de construção (CUB Sinduscon-SP).</p>
    </div>` : '';

  const incorp = x.incorp_aplicavel ? `
    <div class="card incorp">
      ${sec('Potencial para incorporação')}
      <div class="kicker"><span class="badge">valor como terreno</span></div>
      <div class="big">${R$(x.incorp_valor_terreno)}</div>
      <div class="sub">valor máximo que um incorporador pode pagar pelo terreno para o empreendimento fechar com margem${x.incorp_ganho_pct!=null?` — <b>${x.incorp_ganho_pct>=0?'+':''}${Math.round(x.incorp_ganho_pct)}%</b> em relação ao valor como imóvel pronto`:''}.</div>
      ${inc?`
      <div class="grid3">
        <div><div class="kicker">Terreno</div><b>${N(inc.terreno)} m²</b>${inc.frente?` · frente ${inc.frente} m`:''}</div>
        <div><div class="kicker">CA básico / máximo usado</div><b>${inc.ca_basico!=null?inc.ca_basico:'?'} / ${inc.ca}</b>${inc.ca_zona&&inc.ca>inc.ca_zona?` <span class="sub">(zona ${inc.ca_zona}; ${String(inc.categoria).toUpperCase()} ${inc.ca})</span>`:''}</div>
        <div><div class="kicker">Área computável</div><b>${N(inc.area_comput)} m²</b></div>
        <div><div class="kicker">Área construída estimada</div><b>${N(inc.area_constr)} m²</b></div>
        <div><div class="kicker">Área vendável</div><b>${N(inc.area_vendavel)} m²</b></div>
        <div><div class="kicker">Padrão construtivo</div><b>${inc.padraoLb||inc.padrao||'—'}</b></div>
        ${inc.comaer&&inc.comaer.pav!=null?`<div><div class="kicker">Altura máx. COMAER (estim.)</div><b>≈ ${N(inc.comaer.altura)} m · ~${inc.comaer.pav} pav.</b><div class="sub">superfície ${inc.comaer.sup}, PBZPA de Congonhas (ICA 11-408); terreno a ${N(inc.comaer.elev)} m</div></div>`:''}
      </div>
      <div style="margin-top:12px">
        <div class="linha"><span>VGV: ${N(inc.area_vendavel)} m² vendáveis × lançamento ${R$(x.incorp_lancamento_rs_m2)}/m²${inc.lancOrigem?` <span class="sub">(${inc.lancOrigem})</span>`:''}</span><b>${R$(inc.vgv)}</b></div>
        <div class="linha"><span>Obra: ${N(inc.area_constr)} m² construídos × ${R$(inc.custo_m2)}/m² <span class="sub">(CUB ${inc.cubRef||''} ${R$(inc.cub)} × ${P.obra_sobre_cub||'1,68'}, com BDI)</span></span><b class="neg">− ${R$(inc.obra)}</b></div>
        ${inc.despesas!=null?`<div class="linha"><span>Despesas ${pct(P.despesas||0.135)} do VGV (incorporação, aprovações, gestão, marketing, entrega, adm.) + projetos ${pct(P.projetos_sobre_obra||0.025)} da obra</span><b class="neg">− ${R$((inc.despesas||0)+(inc.projetos||0))}</b></div>
        <div class="linha"><span>Comissão ${pct(P.comissao||0.05)} + RET ${pct(P.ret||0.04)} + financiamento da obra ${pct(P.financiamento||0.03)}</span><b class="neg">− ${R$((inc.comissao||0)+(inc.ret||0)+(inc.financiamento||0))}</b></div>`
        :`<div class="linha"><span>Despesas, comissão e impostos</span><b class="neg">− ${R$(inc.indiretos)}</b></div>`}
        <div class="linha"><span>Margem do incorporador ${pct(P.margem||0.15)}</span><b class="neg">− ${R$(inc.margem)}</b></div>
        ${inc.fachada_ativa?`<div class="linha"><span class="sub">Fachada ativa: +${N(inc.area_fachada)} m² de térreo comercial não computável, incluídos no VGV e na obra</span><b></b></div>`:''}
        ${inc.categoria&&inc.categoria!=='mercado'?`<div class="linha"><span class="sub">Categoria ${String(inc.categoria).toUpperCase()}: fator social Fs = ${inc.fs} aplicado à outorga (PDE)</span><b></b></div>`:''}
        ${inc.outorga?`<div class="linha"><span>Outorga onerosa: ${N(inc.area_adicional)} m² acima do CA básico × ${inc.outorga_modo==='formula'?`(terreno ÷ área computável) × ${R$(inc.v)}/m² × Fs ${inc.fs!=null?inc.fs:1} × Fp ${inc.fp!=null?inc.fp:1}`:`${R$(inc.v)}/m²${inc.fs!=null&&inc.fs<1?' × Fs '+inc.fs:''}`} <span class="sub">(${inc.v_origem||''})</span></span><b class="neg">− ${R$(inc.outorga)}</b></div>`:''}
        ${inc.custos_aquisicao?`<div class="linha"><span>Custos de aquisição do terreno (ITBI, comissão, jurídico, demolição, IPTU) ≈ ${pct(P.custo_aquisicao||0.12)}</span><b class="neg">− ${R$(inc.custos_aquisicao)}</b></div>`:''}
        <div class="linha tot"><span>Terreno máximo (o que chega ao proprietário)${inc.terreno_vgv?` <span class="sub">· ${(inc.terreno_vgv*100).toFixed(1)}% do VGV</span>`:''}</span><b>${R$(inc.terreno_max)}</b></div>
      </div>
      ${(inc.lancRef||[]).length?`<div class="foot">Lançamentos anunciados perto: ${inc.lancRef.map(l=>`${l.nome} (${l.status||''}, ${R$(l.rs)}/m², ${N(l.d)} m)`).join('; ')}.</div>`:''}
      ${(inc.alertas||[]).length?`<ul style="margin:8px 0 0;padding-left:18px;font-size:.85em;color:#b45309">${inc.alertas.map(a=>`<li>${a}</li>`).join('')}</ul>`:''}
      ${(inc.base_legal||[]).length?`<div style="margin-top:10px;padding:8px 10px;background:#f0fdf4;border-radius:8px;font-size:.85em"><div style="font-weight:600;color:#047857;margin-bottom:4px">Por que a área vendável é ${inc.ca>(inc.ca_zona||inc.ca)?'maior que terreno × CA da zona':'essa'} — base legal</div><ul style="margin:0;padding-left:18px;color:#334155">${inc.base_legal.map(b=>`<li style="margin:2px 0">${b}</li>`).join('')}</ul></div>`:''}
      ${(inc.refs||[]).length?`<div class="foot">Referência de outorga: ${inc.refs.length} concessões da Prefeitura num raio de 1,5 km (ex.: ${inc.refs.slice(0,3).map(r=>`${r.endereco} — ${R$(r.ct_m2)}/m²`).join('; ')}).</div>`:''}
      `:''}
      <div class="foot">Método do valor residual (involutivo), com o zoneamento vigente (Lei 16.402/2016) e a outorga onerosa do PDE (Lei 16.050/2014). ${P.calibracao?P.calibracao.charAt(0).toUpperCase()+P.calibracao.slice(1)+'. ':''}Sujeito à confirmação de recuos, gabarito e viabilidade de projeto.</div>
    </div>` : '';


  const assinatura = `
    <div class="card">
      ${sec('Responsáveis e natureza do documento')}
      <div class="assin">
        <div><div class="kicker">Corretor responsável</div><b>${x.corretor_nome||'—'}</b><br><span class="sub">${x.corretor_creci?('CRECI '+x.corretor_creci):'CRECI —'}</span></div>
        <div><div class="kicker">Imobiliária</div><b>${NSP.nome}</b><br><span class="sub">${NSP.creci} · ${NSP.desde}<br>${NSP.endereco}<br>${NSP.site}${NSP.telefone?' · '+NSP.telefone:''}</span></div>
      </div>
      <div class="foot" style="margin-top:10px">${TEXTO_LEGAL}</div>
      <div class="foot">Gerada em ${dt}${x.aprovado_em?` e revisada em ${dtAp}`:''}.</div>
    </div>`;

  // ordem do relatório (a numeração segue a ordem em que as seções são montadas)
  const partes = [resumo, parecer, imovel, entorno, referencias, metodo];
  return cabecalho + partes.join('') + incorp + assinatura + `
    <div class="cta">
      <div style="font-size:1.05em;font-weight:700">Quer vender pelo melhor valor possível?</div>
      <div style="opacity:.85;font-size:.92em;margin-top:4px">Nossa equipe apresenta a estratégia completa para o seu imóvel.</div>
      <a href="https://www.novasaopaulo.com.br" target="_blank">Falar com a Nova São Paulo</a>
    </div>`;
}
function pct(v){ return v==null?'—':(Number(v)*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%'; }
function cap(s){ return String(s||'').toLowerCase().replace(/(^|\s|-)([a-zà-ú])/g,(m,a,b)=>a+b.toUpperCase()); }
function compara(pedido,mercado){
  const p=Number(pedido),m=Number(mercado); if(!p||!m) return '';
  const d=Math.round((p/m-1)*100);
  if(Math.abs(d)<3) return 'alinhado ao mercado';
  return d>0?`${d}% acima do valor de mercado`:`${-d}% abaixo do valor de mercado`;
}
async function desenharMapa(x){
  const el=document.getElementById('mapa'); if(!el) return;
  let comps=[]; try{ comps = typeof x.comparaveis==='string'?JSON.parse(x.comparaveis):(x.comparaveis||[]); }catch(_){}
  await new Promise((ok,err)=>{ if(window.L) return ok(); const s=document.createElement('script'); s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; s.onload=ok; s.onerror=err; document.head.appendChild(s); }).catch(()=>null);
  if(!window.L){ el.textContent='(mapa indisponível)'; return; }
  const pts=comps.filter(c=>c.lat&&c.lng&&!c.excluido&&/ITBI|Fechamento|Venda real/i.test(c.origem||c.tipo||'')); const c0 = x.lat?{lat:x.lat,lng:x.lng}:(pts[0]||null); if(!c0) return;
  const map=L.map(el,{zoomControl:!modoPdf,attributionControl:true}).setView([c0.lat,c0.lng],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  const b=[];
  if(x.lat){ L.circleMarker([x.lat,x.lng],{radius:18,color:'#dc2626',weight:2,fillColor:'#dc2626',fillOpacity:.15}).addTo(map);
    L.circleMarker([x.lat,x.lng],{radius:9,color:'#fff',weight:3,fillColor:'#dc2626',fillOpacity:1}).addTo(map).bindTooltip('Imóvel avaliado',{permanent:true,direction:'top',offset:[0,-10],className:'av-tt'}); b.push([x.lat,x.lng]); }
  pts.forEach(c=>{ const itbi=/ITBI|Fechamento|Venda real/i.test(c.origem||''); L.circleMarker([c.lat,c.lng],{radius:7,color:itbi?'#047857':'#2563eb',fillColor:itbi?'#34d399':'#60a5fa',fillOpacity:.8,weight:2}).addTo(map).bindPopup(`${c.endereco||''}<br>${R$(c.preco)} · ${R$(c.rs_m2)}/m²`); b.push([c.lat,c.lng]); });
  if(b.length>1) map.fitBounds(b,{padding:[20,20]});
  setTimeout(()=>map.invalidateSize(),300);
}
carregar();
</script>
