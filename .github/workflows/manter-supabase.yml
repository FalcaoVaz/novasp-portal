# Mantém os projetos Supabase ativos (Rodrigo, 13/10/2026): no plano gratuito o Supabase pausa um projeto depois de
# alguns dias sem uso, e o projeto IPTU (cadastro da Prefeitura usado pela Avaliação) só recebe consulta quando alguém avalia.
# Todo dia faz uma consulta de leitura em cada projeto, com a chave pública que o próprio portal já usa (lida do index.html).
# Nada é gravado. Para rodar fora de hora: aba Actions → "Manter Supabase ativo" → Run workflow.
name: Manter Supabase ativo
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            portal/index.html
            portal/js/00-config.js
          sparse-checkout-cone-mode: false
      - name: Consulta no projeto IPTU
        run: |
          U=$(grep -oE "IPTU_URL='[^']+'" portal/index.html | head -1 | cut -d"'" -f2)
          K=$(grep -oE "IPTU_KEY='[^']+'" portal/index.html | head -1 | cut -d"'" -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$U/rest/v1/rpc/iptu_ruas" -H "apikey: $K" -H "Authorization: Bearer $K" \
                 -H 'Content-Type: application/json' -d '{"p_logradouro":"Rua Aracoiaba","p_numero":"30","p_lim":1}')
          echo "IPTU: HTTP $code"; test "$code" = 200
      - name: Consulta no projeto principal
        run: |
          U=$(grep -oE "const SBU='[^']+'" portal/js/00-config.js | cut -d"'" -f2)
          K=$(grep -oE "const SBK='[^']+'" portal/js/00-config.js | cut -d"'" -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$U/rest/v1/usuarios_login?select=nome&limit=1" -H "apikey: $K" -H "Authorization: Bearer $K")
          echo "Principal: HTTP $code"; test "$code" = 200
