[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."gerar-documento"]
  timeout = 26

[functions."tjsp-esaj"]
  timeout = 26

# Entrega de chaves (23/11/2026): cópia do Imoview de hora em hora; resumo ao gestor seg–sex 8h (11h UTC), só com CHAVES_RESUMO_ATIVO=1
[functions."imoview-sync"]
  schedule = "7 * * * *"

[functions."chaves-resumo"]
  schedule = "0 11 * * 1-5"

# Cafés de parceria do site → Agenda do portal (23/11/2026)
[functions."cafes-sync"]
  schedule = "*/20 * * * *"

# Prazos mensais de vendas (24/11/2026): alerta dias 5/6 (planilha + seleção) e 10/11 (votação) — 9h de SP
[functions."prazos-vendas"]
  schedule = "0 12 * * *"

# Cobrança: inadimplentes do Imoview a cada 30 min (25/11/2026)
[functions."inadimplencia-sync"]
  schedule = "*/30 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    # Permite embed APENAS pelo portal (iframe do juridico dentro do novasp).
    # X-Frame-Options DENY foi trocado por CSP frame-ancestors — mesmo efeito
    # de seguranca, mas com whitelist.
    Content-Security-Policy = "frame-ancestors 'self' https://novasp.netlify.app"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Link de acompanhamento do corretor (18/11/2026): /acompanhar/<token> → função pública só de leitura
[[redirects]]
  from = "/acompanhar/*"
  to = "/.netlify/functions/acompanhar?t=:splat"
  status = 200
